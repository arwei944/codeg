name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build frontend
        run: pnpm build

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: x86_64-pc-windows-msvc

      - name: Build codeg-server
        run: cargo build --release --no-default-features --bin codeg-server
        working-directory: src-tauri

      - name: Build codeg (Tauri desktop)
        run: cargo build --release --bin codeg
        working-directory: src-tauri

      - name: Package
        shell: pwsh
        run: |
          mkdir dist -Force
          cp src-tauri/target/release/codeg.exe dist/
          cp src-tauri/target/release/codeg-server.exe dist/
          mkdir dist/out -Force
          cp -Recurse out/* dist/out/
          Compress-Archive -Path dist/* -DestinationPath "codeg-v0.15.0-win64.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: codeg-v0.15.0-win64
          path: codeg-v0.15.0-win64.zip
