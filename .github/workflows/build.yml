name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CODEG_SKIP_SIDECAR: "1"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: x86_64-pc-windows-msvc

      - name: Build Tauri desktop app (embeds frontend)
        run: pnpm tauri build --bundles nsis
        env:
          CODEG_SKIP_SIDECAR: "1"

      - name: Rename installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if ($installer) {
            Move-Item $installer.FullName "codeg-v0.15.0-setup.exe" -Force
          }

      - uses: actions/upload-artifact@v4
        with:
          name: codeg-v0.15.0-setup
          path: codeg-v0.15.0-setup.exe